<!DOCTYPE html>
<html>
<head>
<style>
  .team-box { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
  .btn { margin-right: 4px; padding: 4px 8px; cursor: pointer; }
  .btn-reset { margin-left: 20px; color: white; background-color: #d9534f; border: 1px solid #d43f3a; }
  .team-name { font-size: 1.1em; margin-bottom: 6px; }
</style>
</head>
<body>
  <div id="points-controls"></div>
  <script>
    const pointsRep = nodecg.Replicant('points');
    const teamNames = ['Aチーム', 'Bチーム', 'Cチーム', 'Dチーム'];
    
    pointsRep.on('change', (newVal) => {
      if (!newVal) return;
      let html = '';
      newVal.forEach((pt, index) => {
        html += `
          <div class="team-box">
            <div class="team-name"><strong>${teamNames[index]}</strong> (現在: ${pt} pt)</div>
            <button class="btn" onclick="addPoint(${index}, 15)">+15</button>
            <button class="btn" onclick="addPoint(${index}, 10)">+10</button>
            <button class="btn" onclick="addPoint(${index}, 7)">+7</button>
            <button class="btn" onclick="addPoint(${index}, 5)">+5</button>
            <button class="btn" style="margin-left: 10px; color: red;" onclick="addPoint(${index}, -1)">-1(修正)</button>
            <!-- リセットボタンを追加 -->
            <button class="btn btn-reset" onclick="resetPoint(${index})">リセット(0)</button>
          </div>
        `;
      });
      document.getElementById('points-controls').innerHTML = html;
    });

    function addPoint(index, amount) {
      pointsRep.value[index] += amount;
    }

    // 0に上書きする関数を追加
    function resetPoint(index) {
      if (confirm(`${teamNames[index]}のポイントを0にリセットしますか？`)) {
        pointsRep.value[index] = 0;
      }
    }
  </script>
</body>
</html>
