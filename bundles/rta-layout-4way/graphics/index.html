<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      background-color: transparent; /* OBS上では透過 */
      font-family: 'Meiryo', sans-serif;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      position: relative;
    }

    /* 4窓のコンテナ: 上部と下部にヘッダー領域を設ける想定 */
    .grid-container {
      display: grid;
      grid-template-columns: 960px 960px;
      grid-template-rows: 540px 540px;
      width: 1920px;
      height: 1080px;
    }

    /* 各プレイヤーの領域。上部をゲーム画面に被らないヘッダーにする */
    .player-box {
      position: relative;
      box-sizing: border-box;
      border: 2px solid rgba(255, 255, 255, 0.3); /* 境界線（レイアウト確認用） */
    }

    /* 走者名とポイントの表示バー (上部に配置) */
    .info-bar {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 40px;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      box-sizing: border-box;
      font-size: 24px;
      font-weight: bold;
    }

    /* 中央のタイマー */
    .timer-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 10px 40px;
      border: 3px solid #fff;
      border-radius: 10px;
      font-size: 48px;
      font-family: monospace;
      z-index: 10;
    }
  </style>
</head>
<body>
  <!-- 中央タイマー -->
  <div class="timer-center" id="timer-display">00:00:00</div>

  <!-- 4窓グリッド -->
  <div class="grid-container">
    <div class="player-box">
      <div class="info-bar">
        <span id="name-0">Runner 1</span>
        <span><span id="point-0">0</span> pt</span>
      </div>
    </div>
    <div class="player-box">
      <div class="info-bar">
        <span id="name-1">Runner 2</span>
        <span><span id="point-1">0</span> pt</span>
      </div>
    </div>
    <div class="player-box">
      <div class="info-bar">
        <span id="name-2">Runner 3</span>
        <span><span id="point-2">0</span> pt</span>
      </div>
    </div>
    <div class="player-box">
      <div class="info-bar">
        <span id="name-3">Runner 4</span>
        <span><span id="point-3">0</span> pt</span>
      </div>
    </div>
  </div>

  <script>
    const stopwatchRep = nodecg.Replicant('stopwatch');
    const runnersRep = nodecg.Replicant('runners');
    const pointsRep = nodecg.Replicant('points');

    stopwatchRep.on('change', (newVal) => {
      document.getElementById('timer-display').innerText = newVal.formatted;
    });

    runnersRep.on('change', (newVal) => {
      if (!newVal) return;
      newVal.forEach((name, i) => {
        document.getElementById(`name-${i}`).innerText = name;
      });
    });

    pointsRep.on('change', (newVal) => {
      if (!newVal) return;
      newVal.forEach((pt, i) => {
        document.getElementById(`point-${i}`).innerText = pt;
      });
    });
  </script>
</body>
</html>
