<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0; padding: 0; width: 1920px; height: 1080px;
      background: transparent; font-family: 'Meiryo', sans-serif;
      overflow: hidden; position: relative;
    }

    .layout-bg {
      position: absolute; width: 100%; height: 100%;
      background-image: linear-gradient(to bottom, #1a1a2e, #16213e);
      z-index: -1;
    }

    .player-box {
      position: absolute; width: 680px; height: 540px;
      display: flex; flex-direction: column;
    }

    #p1 { top: 0; left: 0; }
    #p2 { top: 0; right: 0; }
    #p3 { bottom: 0; left: 0; }
    #p4 { bottom: 0; right: 0; }

    .info-bar {
      width: 100%; height: 30px;
      background: rgba(0, 0, 0, 0.85);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 15px; box-sizing: border-box;
      font-size: 18px; font-weight: bold;
      border-bottom: 2px solid #555;
    }

    .runner-name { color: #fff; text-shadow: 1px 1px 2px #000; }
    .point-box { color: #ffcc00; text-shadow: 1px 1px 2px #000; }
    
    /* チームカラーのバッジ装飾 */
    .team-badge {
      display: inline-block; padding: 0 8px; margin-right: 8px;
      border-radius: 4px; font-size: 16px; text-shadow: none;
    }
    .badge-a { background: #d9534f; color: white; } /* 赤 */
    .badge-b { background: #337ab7; color: white; } /* 青 */
    .badge-c { background: #5cb85c; color: white; } /* 緑 */
    .badge-d { background: #f0ad4e; color: white; } /* 黄 */

    .game-screen {
      width: 680px; height: 510px; background: transparent;
      box-sizing: border-box; border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .center-area {
      position: absolute; top: 0; left: 680px;
      width: 560px; height: 1080px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }

    .timer-center {
      background: rgba(0, 0, 0, 0.9); padding: 10px 40px;
      border: 4px solid #fff; border-radius: 8px;
      font-size: 64px; font-family: monospace; font-weight: bold;
      color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="layout-bg"></div>

  <div class="center-area">
    <div class="timer-center" id="timer-display">00:00:00</div>
  </div>

  <div class="player-box" id="p1">
    <div class="info-bar">
      <span class="runner-name"><span class="team-badge badge-a">Aチーム</span><span id="name-0"></span></span>
      <span class="point-box"><span id="point-0">0</span> pt</span>
    </div>
    <div class="game-screen"></div>
  </div>

  <div class="player-box" id="p2">
    <div class="info-bar">
      <span class="runner-name"><span class="team-badge badge-b">Bチーム</span><span id="name-1"></span></span>
      <span class="point-box"><span id="point-1">0</span> pt</span>
    </div>
    <div class="game-screen"></div>
  </div>

  <div class="player-box" id="p3">
    <div class="info-bar">
      <span class="runner-name"><span class="team-badge badge-c">Cチーム</span><span id="name-2"></span></span>
      <span class="point-box"><span id="point-2">0</span> pt</span>
    </div>
    <div class="game-screen"></div>
  </div>

  <div class="player-box" id="p4">
    <div class="info-bar">
      <span class="runner-name"><span class="team-badge badge-d">Dチーム</span><span id="name-3"></span></span>
      <span class="point-box"><span id="point-3">0</span> pt</span>
    </div>
    <div class="game-screen"></div>
  </div>

  <script>
    const stopwatchRep = nodecg.Replicant('stopwatch');
    const runnersRep = nodecg.Replicant('runners');
    const pointsRep = nodecg.Replicant('points');

    stopwatchRep.on('change', (newVal) => {
      if(newVal) document.getElementById('timer-display').innerText = newVal.formatted;
    });

    runnersRep.on('change', (newVal) => {
      if (!newVal) return;
      newVal.forEach((name, i) => {
        document.getElementById(`name-${i}`).innerText = name;
      });
    });

    pointsRep.on('change', (newVal) => {
      if (!newVal) return;
      newVal.forEach((pt, i) => {
        document.getElementById(`point-${i}`).innerText = pt;
      });
    });
  </script>
</body>
</html>
